# golangci-lint config модуля tests/ (e2e-харнесс, e2e harness) — та же база,
# что и корневой .golangci.yml, БЕЗ depguard-правила "execx": оно запрещает
# прямой os/exec вне internal/execx корневого модуля (мокабельность
# запуска процессов), но у tests/ этого слоя нет и не должно быть — сам смысл
# черноящичного e2e-теста в том, чтобы запускать РЕАЛЬНЫЙ бинарник через
# os/exec, а не через internal-Runner.
version: "2"

run:
  timeout: 15m
  tests: true

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - loggercheck
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: устарело; используйте io и os.
            - pkg: github.com/pkg/errors
              desc: используйте стандартные errors и fmt.Errorf с %w.
    exhaustive:
      default-signifies-exhaustive: true
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Весь модуль — тесты (*_test.go по контракту go test), gosec/noctx
      # избыточно строги для e2e-харнесса (запуск процессов, временные файлы).
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.example.test/template-factory/tplater/tests
