# golangci-lint config for tests/ (the e2e harness), based on the root config
# WITHOUT the depguard "execx" rule. That rule forbids direct os/exec outside
# root internal/execx for process mockability, but tests/ has no such layer and
# must not have one: black-box e2e tests intentionally run the REAL binary via
# os/exec rather than an internal runner.
version: "2"

run:
  timeout: 15m
  tests: true

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gocritic
    - loggercheck
    - makezero
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
    - whitespace

  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: io/ioutil
              desc: deprecated; use io and os.
            - pkg: github.com/pkg/errors
              desc: use standard errors and fmt.Errorf with %w.
    exhaustive:
      default-signifies-exhaustive: true
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # The entire module is tests (*_test.go by go test contract); gosec/noctx
      # are overly strict for the e2e harness (processes and temporary files).
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - git.example.test/template-factory/tplater/tests
