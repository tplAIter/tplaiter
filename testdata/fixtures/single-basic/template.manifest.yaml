# single-basic — fixture for internal/engine and related component tests
# ///. NOT a Go project — text files; the sole purpose of the files/ tree is to
# exercise engine mechanics: is/has, __if_<group>__,
# __if_<group>=<value>__, file rules (paths/remove), copyWithoutRender +
# postReplace, partials, and the __slug__ placeholder.
apiVersion: tplater.dev/v1alpha1
kind: Template
metadata:
  name: single-basic
  displayName: "Single Basic Fixture"
  version: 0.1.0
  description: "Фикстура engine-тестов: select+вложенный toggle, multiselect, files-правила."
  labels:
    lang: [fixture]
    type: [fixture]
  docs: README.md
  notes: NOTES.tmpl

engine:
  type: gotemplate
  root: files
  copyWithoutRender:
    - "**/dashboards/*.json"
  postReplace:
    - { glob: "**/dashboards/*.json", placeholder: "__PROJECT_SLUG__", contextKey: "Project.Slug" }

requires:
  tplater: ">=0.1.0"

settings:
  - group: database
    title: "База данных"
    type: select
    default: none
    options:
      - id: none
        title: "Без БД"
      - id: postgres
        title: "PostgreSQL"
        settings:
          - group: migrations
            title: "Миграции"
            type: toggle
            default: false
  - group: brokers
    title: "Брокеры сообщений"
    type: multiselect
    options:
      - id: kafka
        title: "Kafka"
      - id: rabbitmq
        title: "RabbitMQ"

files:
  - when: "database=postgres"
    paths: ["extra/postgres-only.txt"]
  # Composite removal (the COMPOSITE_REMOVALS Python-hook analogue) is a
  # CONJUNCTION of atoms joined by && in one `when`, NOT `anyOf`: settings.Eval
  # treats && as AND inside Condition, while settings.EvalAny (what `anyOf`
  # compiles to) is OR over a list of strings (see the behavior description).
  - when: "brokers!=kafka && brokers!=rabbitmq"
    remove: ["integrations/**"]
  # anyOf — OR: remove the legacy note as soon as ANY modern option is selected
  # (postgres OR kafka), rather than requiring both at once.
  - anyOf: ["database=postgres", "brokers=kafka"]
    remove: ["legacy/**"]

commands:
  dev:
    run: "echo dev"
    description: "локальный запуск фикстуры"
  test:
    run: "echo test"
    description: "прогон тестов фикстуры"

hooks:
  postCreate:
    - run: "echo postCreate"
