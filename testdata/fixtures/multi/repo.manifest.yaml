# multi — multi-template repository fixture for /
# ("repository template list/selection") tests. Two very small templates —
# alpha (toggle setting) and beta (string setting) — are enough to exercise
# template selection and engine rendering without testing the engine again
# (single-basic does that).
apiVersion: tplater.dev/v1alpha1
kind: Repository
metadata:
  name: fixture-repo
  description: "Мульти-шаблонный репозиторий-фикстура для offline-тестов tplater."
templates:
  - path: alpha
  - path: beta
