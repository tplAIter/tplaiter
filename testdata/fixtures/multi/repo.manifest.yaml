# multi — фикстура мульти-шаблонного репозитория, для тестов /
# ("список/выбор шаблона репозитория"). Два предельно маленьких шаблона —
# alpha (toggle-настройка) и beta (string-настройка) — достаточно, чтобы
# упражнять выбор шаблона и рендер каждого движком, не тестируя сам движок
# повторно (это делает single-basic).
apiVersion: tplater.dev/v1alpha1
kind: Repository
metadata:
  name: fixture-repo
  description: "Мульти-шаблонный репозиторий-фикстура для offline-тестов tplater."
templates:
  - path: alpha
  - path: beta
