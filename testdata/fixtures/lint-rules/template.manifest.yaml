# lint-rules — arch-lint lint-section fixture (implementation check). Minimal
# Go project: two toggled files (dirty.go/generated.go render in clean OR
# violating form according to the violations toggle) + always-clean clean.go +
# main.go (the no-panic rule permits panic in main). Goal — e2e lint-template:
# toggle off (defaults) is green, toggle on (all-on/max, generated
# automatically for toggle groups by [Combos]) is red with violations from all
# 4 rules.
apiVersion: tplater.dev/v1alpha1
kind: Template
metadata:
  name: lint-rules
  displayName: "Lint Rules Fixture"
  version: 0.1.0
  description: "Фикстура arch-lint правил lint-template: ctx-first/no-init/no-panic/generated-marker."

engine:
  type: gotemplate
  root: files

requires:
  tplater: ">=0.1.0"

settings:
  - group: violations
    title: "Включить нарушения arch-lint (негативный путь фикстуры)"
    type: toggle
    default: false

lint:
  rules:
    - id: ctx-first
      paths: ["clean.go", "dirty.go"]
      exclude: ["**/*_test.go"]
    - id: no-init
      paths: ["clean.go", "dirty.go"]
    - id: no-panic
      paths: ["clean.go", "dirty.go", "main.go"]
    - id: generated-marker
      paths: ["generated.go"]

commands:
  test:
    run: "echo lint-rules fixture"
