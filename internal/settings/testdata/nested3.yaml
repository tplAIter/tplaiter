apiVersion: tplater.dev/v1alpha1
kind: Template
metadata:
  name: nested-demo
  version: 1.0.0
settings:
  - group: database
    title: "Database"
    type: select
    default: none
    options:
      - id: none
        title: "No DB"
      - id: postgres
        title: "PostgreSQL"
        settings:
          - group: pg_pool          # level 2
            title: "Connection pool"
            type: select
            default: small
            options:
              - id: small
              - id: large
                settings:
                  - group: pg_shards   # level 3
                    title: "Shard count"
                    type: int
                    default: 4
          - group: idempotency
            title: "Idempotency"
            type: toggle
            default: false
      - id: mysql
        title: "MySQL"
  - group: brokers
    title: "Brokers"
    type: multiselect
    default: []
    options:
      - id: kafka
        settings:
          - group: kafka_ssl
            type: toggle
            default: false
      - id: rabbitmq
  - group: auth
    type: multiselect
    default: []
    options:
      - id: sso_provider
        requires: ["database=postgres"]
      - id: audit
        requires: ["brokers=kafka"]
  - group: metrics
    type: toggle
    default: false
  - group: extras
    type: multiselect
    default: []
    options:
      - id: dashboards
        requires: ["metrics=true"]
constraints:
  - if: "idempotency=true"
    require: "database=postgres"
    message: "Idempotency requires PostgreSQL"
