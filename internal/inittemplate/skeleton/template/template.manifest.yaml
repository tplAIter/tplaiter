# Template manifest. Skeleton with two example settings groups, a files rule,
# placeholder commands, a hook, generator, ai-config, and environment playbook.
# Run `tplaiter lint-template` after edits.
apiVersion: tplater.dev/v1alpha1
kind: Template
metadata:
  name: << .Name >>
  displayName: "<< .Name >> (skeleton)"
  version: 0.1.0
  description: "Template skeleton generated by tplaiter init-template. Customize for your vertical."
  labels:
    lang: [example]
    type: [skeleton]
  docs: files/README.md.tmpl
  notes: NOTES.tmpl

engine:
  type: gotemplate
  root: files

requires:
  tplater: ">=0.1.0"

# ── Settings groups ─────────────────────────────────────────────
# Rule: a group value enters render context as .Settings.<group> and the is/has
# helpers. Nested refinements (Option.settings) are active only when their parent
# option is selected.
settings:
  # toggle — simple flag. Controls files/__if_feature_x__/ and in-file tplater:if markers.
  - group: feature_x
    title: "Feature X"
    description: "Example toggle flag: enables additional file and blocks."
    type: toggle
    default: false

  # select with two options; advanced carries a nested refinement (verbose
  # toggle), prompted/active only when variant=advanced.
  - group: variant
    title: "Variant"
    description: "Example select group with nested refinement."
    type: select
    default: standard
    options:
      - id: standard
        title: "Standard"
      - id: advanced
        title: "Advanced"
        settings:
          - group: verbose
            title: "Verbose output"
            description: "Nested refinement: active only when variant=advanced."
            type: toggle
            default: false

# ── Files rules ──────────────────────────────────────────────
# When adding a vertical, describe its directory here (paths — "include when
# true", remove — "remove when true"). Conditional __if_<group>__ directories
# and tplater:if/begin/end markers provide precise alternatives.
files:
  - when: "variant=advanced"
    paths: ["advanced/**"]

# ── Project commands (`tplaiter run`) ─────────────────────────────────────────
# TODO(maintainer): replace echo placeholders with your vertical's real commands.
commands:
  dev:
    run: "echo 'TODO: replace with real dev run'"
    description: "Local run (placeholder)"
  test:
    run: "echo 'TODO: replace with real test run'"
    description: "Test run (placeholder)"

# ── Lifecycle hooks ────────────────────────────────────────────────────
hooks:
  postCreate:
    - run: "echo 'project created from template << .Name >>'"
      optional: true

# ── Generators (`tplaiter gen`) ──────────────────────────────────────────────
generators:
  - kind: example
    description: "Example generator: creates a file and inserts a line at an anchor."
    snippet: generators/example.go.tmpl
    target: "internal/example/{{ .Name.Snake }}.go"
    anchors:
      - file: internal/example/registry.go
        anchor: "// tplater:gen:example"
        insert: generators/example.anchor.tmpl

# ── ai-config ───────────────────────────────────────────────────
aiConfig:
  path: ai-config

# ── Environment ───────────────────────────────────────────────────
environment:
  playbooks:
    - name: setup
      file: environment/setup.yml
      description: "Example Ansible playbook for environment setup (debug task)."
