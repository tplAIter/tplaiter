# Multi-repository manifest: lists repository templates.
# Each templates[].path is a subdirectory with its own template.manifest.yaml.
# To add a template, create its manifest subdirectory and add it here.
apiVersion: tplater.dev/v1alpha1
kind: Repository
metadata:
  name: << .Name >>
  description: "Репозиторий шаблонов << .Name >> (сгенерирован tplaiter init-template --multi)"
  maintainers:
    - name: "TODO: имя мейнтейнера"
      email: "todo@example.com"
templates:
  - path: << .Name >>
